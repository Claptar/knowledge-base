site_name: Study knowledge base
site_description: >-
  Trajectories through mathematics and computational biology — which question opened a
  topic, what it attached to, where it clicked, and what is still loose.
site_url: https://claptar.github.io/knowledge-base/
repo_url: https://github.com/Claptar/knowledge-base
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  # Maths. `generic: true` emits \(...\) / \[...\] wrappers for MathJax, which is
  # loaded below. Source stays `$…$` and `$$…$$` so the markdown reads as plain text.
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Working scaffolding for new notes, not site content.
exclude_docs: |
  _template.md

plugins:
  - search

# Broken internal links and missing anchors fail the build. The knowledge base
# cross-references heavily by design — a stale link is worse than no link.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Open questions: questions.md
  - Study log: log.md
  - Profile: profile.md
  - Resources: resources.md
  - Topics:
      - Mathematical modelling: topics/mathematical-modelling.md
