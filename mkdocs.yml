site_name: Study knowledge base
site_description: >-
  Trajectories through mathematics and computational biology — which question opened a
  topic, what it attached to, where it clicked, and what is still loose.
site_url: https://claptar.github.io/knowledge-base/
repo_url: https://github.com/Claptar/knowledge-base
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  # Maths. `generic: true` emits \(...\) / \[...\] wrappers for MathJax, which is
  # loaded below. Source stays `$…$` and `$$…$$` so the markdown reads as plain text.
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Working scaffolding for new notes, not site content.
exclude_docs: |
  _template.md

plugins:
  - search
  # Reads docs/reference/SUMMARY.md as the nav for the converted tree. That file is generated
  # by skills/normalise-materials/scripts/normalise_source.py and is not edited by hand.
  - literate-nav:
      nav_file: SUMMARY.md
      implicit_index: true

# Broken internal links and missing anchors fail the build. The knowledge base
# cross-references heavily by design — a stale link is worse than no link.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Open questions: questions.md
  - Learning path: path.md
  - Study log: log.md
  - Profile: profile.md
  - Resources:
      - Overview: resources/index.md
      - Courses: resources/courses.md
      - Berkeley statistics: resources/berkeley-statistics.md
      - Doing mathematics: resources/doing-mathematics.md
      - Analysis: resources/analysis.md
      - Linear algebra: resources/linear-algebra.md
      - Probability: resources/probability.md
      - Statistics: resources/statistics.md
      - Stochastic processes: resources/stochastic-processes.md
      - CME and transcription: resources/cme-transcription.md
      - Omics statistics: resources/omics-statistics.md
      - Modelling: resources/modelling.md
  - Notes:
      - Overview: notes/index.md
      - Structures:
          - 01 Binary operations: notes/structures/01-binary-operations-and-associativity.md
          - 02 Semigroups and monoids: notes/structures/02-semigroups-and-monoids.md
          - 03 Groups and reversibility: notes/structures/03-groups-and-reversibility.md
          - 04 Symmetries and groups: notes/structures/04-symmetries-and-groups.md
          - 05 Commutativity and abelian groups: notes/structures/05-commutativity-and-abelian-groups.md
          - 06 Rings and distributivity: notes/structures/06-rings-and-distributivity.md
          - 07 Fields and scalars: notes/structures/07-fields-and-scalars.md
          - 08 Vector spaces: notes/structures/08-vector-spaces.md
          - 09 Algebras over fields: notes/structures/09-algebras-over-fields.md
          - 10 Sigma-algebras: notes/structures/10-sigma-algebras.md
          - 11 Map of structures: notes/structures/11-map-of-structures.md
      - Linear algebra:
          - Linear subspaces: notes/linear-algebra/linear-subspaces.md
          - Basis and coordinates: notes/linear-algebra/basis-coordinates.md
          - Change of basis: notes/linear-algebra/change-of-basis.md
          - Isomorphism: notes/linear-algebra/isomorphism.md
          - Direct sums and complements: notes/linear-algebra/direct-sums-and-complements.md
          - Quotient spaces: notes/linear-algebra/quotient-spaces.md
      - Probability:
          - Gaussian vectors (confusion): notes/probability/gaussian-vectors-covariance-geometry.md
          - Gaussian vectors (conceptual): notes/probability/gaussian-vectors-covariance-geometry-alt.md
          - Sample variance as quadratic form: notes/probability/sample-variance-quadratic-form.md
          - Sample variance geometry: notes/probability/sample-variance-quadratic-form-geometry.md
  # Converted source material. The subtree's own nav is generated into
  # docs/reference/SUMMARY.md — never list its pages here.
  - Reference: reference/
  # - Topics:  … no topic file exists yet; a topic file is harvested from a session, never seeded.
  #     Add entries here as sessions produce them, or the strict build fails on the new page.
