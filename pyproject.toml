[project]
name = "knowledge-base"
version = "0.2.0"
description = "Static site build for the study knowledge base"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# MkDocs 1.x is pinned deliberately. Material has announced that MkDocs 2.0
# removes the plugin system and rewrites theming, with no migration path.
# This is not a stale pin — read before bumping it.
dev = [
    "mkdocs<2",
    "mkdocs-material<10",
    # The converted reference tree is several hundred pages. literate-nav keeps its nav in a
    # generated docs/reference/SUMMARY.md instead of in mkdocs.yml, so the hand-written config
    # stays hand-written and a conversion run does not produce a thousand-line diff in it.
    "mkdocs-literate-nav<1",
]

# Source conversion. A separate group so the site build stays small, and declared here
# rather than installed with brew so that `uv sync --group convert` reproduces the toolchain
# on any machine — the same reason sources/ has a lockfile.
#
# All four ship as wheels with no system libraries: pymupdf4llm replaces poppler for PDFs,
# pypandoc-binary bundles the pandoc executable itself.
convert = [
    "pymupdf4llm",      # PDF -> markdown, preserving headings and layout
    "pypandoc-binary",  # LaTeX/HTML/docx -> markdown; bundles pandoc, no system install
    "markdownify",      # HTML -> markdown, when pandoc is heavier than the job needs
]

# Notebooks are read directly from the .ipynb JSON rather than via nbconvert, which writes
# image outputs as links to files the converter does not emit — and a broken link fails the
# strict site build. See convert_notebook() in normalise_source.py.
