name: Check links that leave the site

# `mkdocs build --strict` fails on a broken link inside this site, which is the guarantee the
# notes are cross-referenced against. A link that leaves this site — into the reference library,
# or into any other repo of his — is invisible to --strict, so this replaces that guarantee
# across the boundary.
#
# It is a schedule rather than a push check on purpose: these links break when the *other* repo
# changes, which is an event this repo never sees.
#
# Scope is deliberately his own URLs — the library site and github.com/Claptar — not every
# external link in docs/. The course and paper links run to hundreds, many behind auth or a
# paywall, and a check that cries wolf is a check that gets switched off. These are the URLs he
# controls, so a failure here is always actionable.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, early
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect and check every link that leaves the site
        run: |
          set -uo pipefail
          grep -rhoE 'https://(claptar\.github\.io|github\.com/Claptar)/[^)"< ]*' docs/ \
            | sed 's/[.,]$//' | sort -u > links.txt
          count=$(wc -l < links.txt | tr -d ' ')
          echo "Found $count distinct outbound links."
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          fail=0
          while read -r url; do
            # Follow redirects: MkDocs' use_directory_urls means a missing trailing slash is a 301.
            code=$(curl -sSL -o /dev/null -m 30 -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  ok   $url"
            else
              echo "  $code  $url"
              fail=1
            fi
          done < links.txt

          if [ "$fail" -ne 0 ]; then
            echo
            echo "A link out of this site no longer resolves."
            echo "Into the library: the page moved (re-run the converter and update the catalogue"
            echo "entry), or the source was withdrawn. Into a repo: it was renamed or made private."
            echo "Do not delete the link without recording why: the catalogue entry is the durable"
            echo "half, and its source URL is never dropped."
            exit 1
          fi
