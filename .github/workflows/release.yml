name: Release

# A merge to main cuts a release: a tag at the merge commit, with the release
# notes for that version taken from CHANGELOG.md and attached to it.
#
# The version comes from .claude-plugin/plugin.json and is the release date,
# YY-DDD, or YY-DDD.N for a later release the same day (see AGENTS.md § Git). The
# tag is the version itself, with no `v`. The job stops if that tag already
# exists, so the release fires on the merges that set a new version and stays
# quiet on the ones that don't — which is what keeps a repo whose docs/ changes
# every study session from accumulating a tag per note.
#
# To release on *every* merge instead, derive the version from the date here
# (`date -u +%y-%j`, plus the next free .N) rather than reading plugin.json; the
# rest of the job is unchanged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::no version in .claude-plugin/plugin.json"
            exit 1
          fi
          echo "version=$version"     >> "$GITHUB_OUTPUT"
          echo "tag=$version"         >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null; then
            echo "${{ steps.v.outputs.tag }} exists — nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Checked only for a version about to be released, so a merge that leaves an
      # already-tagged version alone stays quiet whatever its shape. The day must
      # round-trip through a real date: 26-000, 26-367 and 26-366 (2026 is not a
      # leap year) are typos, and a tag is permanent.
      - name: Check the version is a date
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from datetime import datetime
          v = os.environ["VERSION"]
          m = re.fullmatch(r"(\d{2}-\d{3})(\.[1-9]\d*)?", v)
          try:
              ok = bool(m) and datetime.strptime(m[1], "%y-%j").strftime("%y-%j") == m[1]
          except ValueError:
              ok = False
          if not ok:
              print(f"::error::version {v} is not YY-DDD or YY-DDD.N for a real date (date +%y-%j)")
              sys.exit(1)
          PY

      # The notes are the CHANGELOG section for this version: everything between
      # its heading and the next one. The heading must be the version exactly,
      # alone or followed by a space, so 26-280 never matches `## 26-280.1`. A
      # release with no section is a mistake, so fail rather than publish an
      # empty one.
      - name: Extract release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v v="## ${{ steps.v.outputs.version }}" '
            $0 == v || index($0, v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.v.outputs.version }}"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Create annotated tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.tag }}" -F RELEASE_NOTES.md
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
